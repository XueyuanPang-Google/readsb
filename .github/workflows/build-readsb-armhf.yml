name: readsb armhf auto-build

# 每天 UTC 03:00（北京 11:00）检查上游 tag，有新版本才编译
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: '强制编译指定 ref（留空 = 自动取上游最新 tag）'
        default: ''
        required: false

permissions:
  contents: write

concurrency:
  group: readsb-armhf
  cancel-in-progress: false

jobs:
  # ── 1. 查上游最新 tag，判断要不要编译 ──────────────────────────────
  check:
    runs-on: ubuntu-24.04
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
      need: ${{ steps.pick.outputs.need }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCED: ${{ inputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${FORCED:-}" ]; then
            ref="$FORCED"
          else
            ref=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/wiedehopf/readsb/tags?per_page=1" \
                  | jq -r '.[0].name')
          fi
          echo "upstream latest tag: $ref"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/repos/$REPO/releases/tags/armhf-$ref")
          echo "existing release check -> HTTP $code"
          if [ "$code" = "200" ]; then
            echo "need=false" >> "$GITHUB_OUTPUT"
          else
            echo "need=true" >> "$GITHUB_OUTPUT"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # ── 2. 在 armv7 容器里编译并打成 .deb（qemu 模拟）──────────────────
  build:
    needs: check
    if: needs.check.outputs.need == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout readsb source
        uses: actions/checkout@v4
        with:
          repository: wiedehopf/readsb
          ref: ${{ needs.check.outputs.ref }}
          path: src
          fetch-depth: 1

      - name: Build inside armv7 (qemu) container
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: armv7
          distro: bookworm
          githubToken: ${{ github.token }}
          dockerRunArgs: |
            --volume "${PWD}/src:/src"
          install: |
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential pkg-config ca-certificates git \
              librtlsdr-dev libusb-1.0-0-dev zlib1g-dev libzstd-dev \
              libncurses-dev file
          run: |
            set -eux
            cd /src
            uname -m
            git config --global --add safe.directory /src || true
            make -j"$(nproc)" RTLSDR=yes
            file readsb
            ./readsb --version || true

            REF="${{ needs.check.outputs.ref }}"
            VER="${REF#v}-1~armhf1"
            ROOT=/src/pkg
            rm -rf "$ROOT"
            mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" "$ROOT/etc/default" "$ROOT/lib/systemd/system"
            install -m 0755 readsb "$ROOT/usr/bin/readsb"

            printf '%s\n' \
              'Package: readsb' \
              "Version: $VER" \
              'Architecture: armhf' \
              'Maintainer: onecloud local build <root@localhost>' \
              'Depends: libc6 (>= 2.34), librtlsdr0, zlib1g, libzstd1, libncurses6' \
              'Section: hamradio' \
              'Priority: optional' \
              'Homepage: https://github.com/wiedehopf/readsb' \
              'Description: ADS-B / Mode-S decoder (wiedehopf fork), prebuilt for armhf' \
              ' Built by GitHub Actions with QEMU armv7 emulation.' \
              " Upstream tag: $REF" \
              > "$ROOT/DEBIAN/control"

            printf '%s\n' \
              '# readsb 启动参数（systemd 通过 EnvironmentFile 读取）' \
              'READSB_OPTS="--device-index 0 --gain -10 --ppm 0 --max-range 360 --net --net-heartbeat 60 --net-ro-size 1250 --net-ro-interval 0.2 --net-ri-port 0 --net-ro-port 30002 --net-sbs-port 30003 --net-bi-port 30004,30104 --net-bo-port 30005 --write-json /run/readsb"' \
              > "$ROOT/etc/default/readsb"

            printf '%s\n' \
              '[Unit]' \
              'Description=readsb ADS-B decoder' \
              'Documentation=https://github.com/wiedehopf/readsb' \
              'After=network.target' \
              '' \
              '[Service]' \
              'Type=simple' \
              'EnvironmentFile=-/etc/default/readsb' \
              "ExecStart=/bin/sh -c 'exec /usr/bin/readsb \$READSB_OPTS'" \
              'Restart=always' \
              'RestartSec=10' \
              'Nice=-5' \
              '' \
              '[Install]' \
              'WantedBy=multi-user.target' \
              > "$ROOT/lib/systemd/system/readsb.service"

            cd "$ROOT"
            find . -type f ! -path './DEBIAN/*' | sed 's|^\./||' | xargs md5sum > DEBIAN/md5sums

            mkdir -p /src/out
            DEB="/src/out/readsb_${REF#v}-1_armhf.deb"
            dpkg-deb --build --root-owner-group "$ROOT" "$DEB"
            dpkg-deb -I "$DEB"
            dpkg-deb -c "$DEB"
            cp /src/readsb /src/out/readsb-armhf
            cd /src/out
            sha256sum ./* | sed 's|\./||' | tee SHA256SUMS
            ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: readsb-armhf-${{ needs.check.outputs.ref }}
          path: |
            src/out/readsb_*.deb
            src/out/readsb-armhf
            src/out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: armhf-${{ needs.check.outputs.ref }}
          name: readsb armhf ${{ needs.check.outputs.ref }}
          body: |
            readsb 预编译（armv7 / armhf），含 .deb

            - 上游：`wiedehopf/readsb` @ `${{ needs.check.outputs.ref }}`
            - 构建：GitHub Actions + QEMU（armv7 bookworm 容器）
            - 依赖：`librtlsdr0` `zlib1g` `libzstd1` `libncurses6`（.deb 自动处理）

            安装：
            ```
            scp readsb_*_armhf.deb root@<ip>:/tmp/
            ssh root@<ip> 'apt install -y /tmp/readsb_*_armhf.deb'
            ```
          files: |
            src/out/readsb_*.deb
            src/out/readsb-armhf
            src/out/SHA256SUMS
          prerelease: false
          fail_on_unmatched_files: true

  # ── 3. 通知（配了 NTFY_TOPIC secret 才推送）───────────────────────
  notify:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Push notification
        env:
          NTFY: ${{ secrets.NTFY_TOPIC }}
          REF: ${{ needs.check.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "${NTFY:-}" ]; then
            echo "no NTFY_TOPIC secret set, skip notification"; exit 0
          fi
          msg="readsb armhf ${REF} 编译完成 → https://github.com/${REPO}/releases/tag/armhf-${REF}"
          curl -fsS -m 20 -d "$msg" \
               -H "Title: readsb 新版本就绪" \
               -H "Tags: airplane" \
               "https://ntfy.sh/${NTFY}" && echo "notified"

  # ── 4. 把 fork 的 dev 与上游同步（保持 commits 可见）───────────────
  sync-fork:
    needs: check
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fast-forward fork dev from upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --quiet --depth=50 "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" fork
          cd fork
          git remote add upstream https://github.com/wiedehopf/readsb.git
          git fetch --quiet --depth=50 upstream dev
          if git merge-base --is-ancestor upstream/dev HEAD; then
            echo "already up to date"; exit 0
          fi
          git -c user.name=github-actions -c user.email=actions@github.com \
              merge --no-edit upstream/dev -m "chore: sync dev from wiedehopf/readsb" || {
                echo "merge conflict, skip sync"; exit 0; }
          git push --quiet origin HEAD:dev && echo "synced"
